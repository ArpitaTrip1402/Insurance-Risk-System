
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: insurance-risk-backend:latest
    container_name: insurance-risk-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: insurance-risk-frontend:latest
    container_name: insurance-risk-frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
